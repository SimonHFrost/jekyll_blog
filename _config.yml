# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Simon Frost
# email: simonhfrost@gmail.com
# description: >- # this means to ignore newlines until "baseurl:"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://simonfrost.ai" # the base hostname & protocol for your site, e.g. http://example.com
linkedin_username: simonhfrost
github_username: simonhfrost
description: >-
  Full-Stack Agentic Engineer. Faster shipping, same standards.
twitter:
  card: summary_large_image

defaults:
  # Default social-share image for every page; seo-tag resolves it to an
  # absolute URL. Per-page `image:` front matter overrides this.
  - scope:
      path: ""
    values:
      image: /assets/profile-picture-2026.jpg
  - scope:
      path: ""
      type: posts
    values:
      show_date: true
      read_time: true

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  # Generates sitemap.xml and robots.txt. Pages with `sitemap: false` are left
  # out, so drafts need it alongside `draft: true`.
  - jekyll-sitemap
# Exclude from processing.
# GitHub Pages builds with Jekyll 3, where this list replaces the defaults
# rather than adding to them, so the defaults are repeated here.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - CNAME
  - Makefile
  - readme.md
  - unicorn-preview.html
  - assets/background/natural-white.afphoto
